name: Auto Apply

on:
  schedule:
    # 6AM, 9AM, 12PM, 3PM, 6PM, 9PM Eastern (cron is UTC; these match EDT/UTC-4).
    # During winter (EST/UTC-5) runs land an hour early — shift to 11,14,17,20,23,2 if that matters.
    - cron: '0 10,13,16,19,22,1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        # Defaults ON for hand-triggered runs. A manual run is usually someone
        # checking a change, and an application cannot be taken back.
        description: 'Fill forms but do not submit'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: auto-apply
  cancel-in-progress: false

jobs:
  auto-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Runs before anything expensive. Without it a repo missing its secrets
      # installs node, deps and a browser, then dies on the last step — six times a
      # day, with no Slack alert, because the webhook is one of the missing secrets.
      - name: Preflight — required secrets and résumé
        id: preflight
        env:
          APPLICANT_NAME: ${{ secrets.APPLICANT_NAME }}
          APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
          APPLICANT_PHONE: ${{ secrets.APPLICANT_PHONE }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          missing=0
          require() {
            if [ -z "$2" ]; then
              echo "::error title=Missing secret::$1 is not set. Run: gh secret set $1"
              missing=1
            fi
          }
          require APPLICANT_NAME  "$APPLICANT_NAME"
          require APPLICANT_EMAIL "$APPLICANT_EMAIL"
          require APPLICANT_PHONE "$APPLICANT_PHONE"

          if [ ! -s assets/resume.pdf ]; then
            echo "::error title=Missing résumé::assets/resume.pdf is absent or empty. Commit your résumé (this repo is private)."
            missing=1
          fi
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning title=No Slack::SLACK_WEBHOOK_URL is not set — this run cannot notify you of anything, including its own failure."
          fi
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Filter/dedup rules decide what we apply to — never run with them broken.
      - name: Run tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Jobify
        env:
          APPLICANT_NAME: ${{ secrets.APPLICANT_NAME }}
          APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
          APPLICANT_PHONE: ${{ secrets.APPLICANT_PHONE }}
          APPLICANT_LINKEDIN: ${{ secrets.APPLICANT_LINKEDIN }}
          APPLICANT_GITHUB: ${{ secrets.APPLICANT_GITHUB }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node src/index.js

      # Runs even when Jobify exits non-zero, so a crash mid-apply still records
      # what was already submitted. Skipped when preflight failed — there is
      # nothing to commit and `git pull --rebase` would just add noise.
      - name: Commit applied_jobs.json
        if: always() && steps.preflight.conclusion != 'failure'
        run: |
          git config user.name "jobify-bot"
          git config user.email "actions@users.noreply.github.com"
          git add applied_jobs.json
          if ! git diff --cached --quiet; then
            # No [skip ci] here. It suppresses *every* workflow for this push,
            # which silently disabled the dashboard deploy that triggers on
            # changes to applied_jobs.json. Nothing in this repo triggers on push
            # to main except that deploy, so there is no loop to guard against.
            git commit -m "chore: update applied_jobs.json"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
