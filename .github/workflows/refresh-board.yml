name: Refresh Board

# Scrapes every source, scores every posting, and commits board.json. It applies to
# nothing — the applier was retired after it reached 8 of 239 postings and reported
# nine submissions no employer ever received. A human works the board by hand.
#
# Twelve runs a day, not hourly and not evenly spaced. A private repo gets 2,000 free
# Actions minutes a month; hourly runs at ~3 minutes each would spend ~2,200 of them, so
# twelve is the budget (~1,080 min/month). But *when* those twelve fire matters: reaching
# a posting early is one of the few real levers a candidate has (src/score.js even scores
# it), so the runs are concentrated when new reqs actually appear rather than smeared
# across the dead of night.
#
# Internship reqs post on weekday mornings, and the target cities straddle two coasts —
# NYC/Toronto/Montreal (Eastern) and SF/Vancouver (Pacific). 9–11am in both zones is
# 13:00–18:00 UTC, so that transcontinental morning window gets an hourly sweep; the
# afternoon gets every-two-hours; and two overnight sweeps catch late posts plus the
# nightly bot commits on the SimplifyJobs/vanshb03/speedyapply feeds.

on:
  schedule:
    # :10 past the hour — GitHub delays runs scheduled on the hour, when everyone
    # else's crons fire. Hours in UTC (ET = −4, PT = −7 in summer):
    #   12–18  hourly  ·  morning post-surge, 8am–2pm ET / 5–11am PT (both coasts' 9–11am)
    #   20, 22         ·  afternoon, 4pm & 6pm ET / 1pm & 3pm PT
    #   00             ·  end of the Pacific business day, 8pm ET / 5pm PT
    #   03, 07         ·  overnight sweeps for late posts and the feeds' nightly commits
    - cron: '10 0,3,7,12,13,14,15,16,17,18,20,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          # The board never opens a browser: only the (disabled) Indeed scraper needs
          # one, and downloading chromium would add a minute to every run, twelve times
          # a day, for nothing.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      # The scoring model and the term classifier decide what the board says. Never
      # publish a board built from broken ones.
      - name: Run tests
        run: npm test

      - name: Refresh the board
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Public dashboard URL — becomes the "Open board →" link in each ping.
          DASHBOARD_URL: https://jobify-dashboard-production.up.railway.app
        run: node src/index.js

      # Runs even when the refresh exits non-zero, so a crash partway through a scrape
      # still records the postings it did find.
      - name: Commit board.json
        if: always()
        run: |
          git config user.name "jobify-bot"
          git config user.email "actions@users.noreply.github.com"
          git add board.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh board.json"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
