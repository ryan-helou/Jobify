name: Deploy Dashboard

# MANUAL ONLY — and think before you run it.
#
# A GitHub Pages site is served publicly even when its repository is private. This
# publishes only the dashboard and board.json (the open-postings catalogue). It must
# NEVER publish applied.json — the private record of what you applied to — which is
# why that file is deliberately not copied below and lives only in this repo and your
# browser. The board renders on the hosted site with no applied marks, by design.
#
# For everyday use run the dashboard locally instead, where your marks persist:
#
#     npm run dashboard
#
# Deploying also requires Pages to be enabled on the repo (it is not: the API
# returns 404, which is why every historical run of this workflow failed at
# actions/configure-pages), and serving Pages from a private repo needs a paid
# plan. The push trigger was removed so those failures stop recurring.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp board.json _site/board.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
